services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: template
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://template:template@postgres:5432/template
      BETTER_AUTH_SECRET: change-me-to-a-random-string-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3001/api/auth
      INTEGRATION_SECRET: change-me-to-a-random-string-at-least-16-chars
      CLIENT_URL: http://localhost:5173
      PORT: "3001"
      LOG_LEVEL: info
      EMAIL_PROVIDER: mailpit
      MAILPIT_HOST: mailpit
      EMAIL_FROM: noreply@localhost
      S3_REGION: us-east-1
      S3_BUCKET: template
      S3_ENDPOINT: http://host.docker.internal:4566
      AI_PROVIDER: ${AI_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-ai/deepseek-v4-flash-0731}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nv-embed-v1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:3001/api/health');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Staging deploys build with VITE_APP_ENV=staging to render the env badge;
      # production (default) bakes "production" and the badge stays hidden.
      args:
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_APP_ENV: ${VITE_APP_ENV:-production}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:5173');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
